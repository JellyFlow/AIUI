    <rect x="1390" y="146" width="170" height="1125" rx="20" fill="#f0f6ee" stroke="#c8ddc3"/><circle cx="1475" cy="195" r="27" fill="#137333"/><path d="M1462 188h26v20h-26zM1468 181v7M1482 181v7" fill="none" stroke="#fff" stroke-width="3"/><text x="1475" y="258" text-anchor="middle" class="group">开发者工具</text><text x="1475" y="283" text-anchor="middle" class="detail">Developer Tools</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340" role="img" aria-labelledby="title desc">
  <title id="title">AIUI detailed module architecture</title>
  <desc id="desc">AIUI layers user entry points, the agent framework, components and APIs, the Ink runtime, and platform services. Design guidelines and developer tools span every layer.</desc>

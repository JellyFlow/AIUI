    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#3c4043" flood-opacity=".12"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#34a853"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5l10 5z" fill="#80868b"/></marker>
    <style>text{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif}.h1{font-size:34px;font-weight:700;fill:#202124}.sub{font-size:17px;fill:#5f6368}.lane{font-size:14px;font-weight:700;fill:#137333;letter-spacing:1px}.group{font-size:21px;font-weight:700;fill:#202124}.card{font-size:17px;font-weight:650;fill:#202124}.detail{font-size:13px;fill:#5f6368}.tiny{font-size:12px;fill:#5f6368}.chip{font-size:12px;font-weight:650;fill:#137333}.req{stroke:#34a853;stroke-width:3;fill:none;marker-end:url(#a)}.evt{stroke:#80868b;stroke-width:2;stroke-dasharray:6 6;fill:none;marker-end:url(#b)}</style>
  </defs>

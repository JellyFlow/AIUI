  <text x="80" y="72" class="h1">AIUI 模块架构</text><text x="80" y="104" class="sub">Module Architecture · 从用户意图到设备执行，再把状态与结果持续反馈给用户</text>
  <g transform="translate(1260 50)"><circle cx="8" cy="8" r="7" fill="#34a853"/><text x="25" y="13" class="tiny">请求 / 调用</text><path d="M115 8h42" class="evt"/><text x="168" y="13" class="tiny">事件 / 反馈</text></g>

